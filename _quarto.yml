project:
  type: book

book:
  title: "Rust Notes"
  author: "Kittipos Sirivongrungson"
  date: today
  repo-url: https://github.com/Lightbridge-KS/rust-notes
  site-url: https://rust-notes-lightbridge.netlify.app
  chapters:
    - index.qmd
    - part: Concept
      chapters: 
       - text: Ownership
         href: "contents/concept/rust-ownership.qmd"
    - part: Tooling
      chapters: 
        - text: Cargo Commands
          href: "contents/tooling/cargo-commands.qmd"

format:
  html:
    theme:
      light:
        - theme/warm-light.scss
      dark:
        - theme/warm-dark.scss
    toc-depth: 4
    highlight-style:
      light: theme/atom-one-light-warm.theme
      dark: theme/atom-one-dark-warm.theme

freeze: auto
