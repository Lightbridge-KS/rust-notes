project:
  type: book

book:
  title: "Rust Notes"
  author: "Kittipos Sirivongrungson"
  date: today
  repo-url: https://github.com/Lightbridge-KS/rust-notes
  site-url: https://rust-notes-lightbridge.netlify.app
  chapters:
    - index.qmd
    - part: Overview
      chapters: 
        - text: Rust Tour
          href: "contents/basic/rust-overview.qmd"
    - part: Data Type
      chapters: 
        - text: Rust Types
          href: "contents/datatypes/overview-datatypes.qmd"
        - text: Scalar & Compound 
          href: "contents/datatypes/scalar-n-compound.qmd"
        - text: Structs
          href: "contents/datatypes/structs.qmd"
        - text: Enums
          href: "contents/datatypes/enums.qmd"
        - text: Traits
          href: "contents/datatypes/traits.qmd"
        - text: Option<T>
          href: "contents/datatypes/option.qmd"
        - text: Smart Pointers
          href: "contents/datatypes/smart-pointers.qmd"
    - part: Function
      chapters: 
        - text: Fn Basic
          href: "contents/func/fn-basic.qmd"
        - text: Closure
          href: "contents/func/closure.qmd"
        - text: Macros
          href: "contents/func/macros.qmd"
    - part: Concept
      chapters: 
       - text: Ownership
         href: "contents/concept/rust-ownership.qmd"
       - text: Onewriter XOR Manyreader
         href: "contents/concept/onewriter-xor-manyreader.qmd"
       - text: Dereference 
         href: "contents/concept/dereference.qmd"
       - text: Coercion
         href: "contents/concept/coercion.qmd"
       - text: Static vs Dyn dispatch
         href: "contents/concept/static-vs-dyn-dispatch.qmd"
    - part: Tooling
      chapters: 
        - text: Cargo Commands
          href: "contents/tooling/cargo-commands.qmd"

format:
  html:
    theme:
      light:
        - theme/warm-light.scss
      dark:
        - theme/warm-dark.scss
    toc-depth: 4
    highlight-style:
      light: theme/atom-one-light-warm.theme
      dark: theme/atom-one-dark-warm.theme

freeze: auto
